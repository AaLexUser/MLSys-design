<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="334" viewBox="0 0 1050 334" role="img" aria-labelledby="title">
<title id="title">Эталоны и способы проверки 58 оцениваемых задач</title>
<rect width="100%" height="100%" fill="white"/>
<g font-family="Arial, sans-serif" font-size="14" fill="#243447">
<text x="20" y="26" font-size="19" font-weight="bold">Эталоны и способы проверки 58 оцениваемых задач</text>
<rect x="20" y="43" width="12" height="12" fill="#3477aa"/>
<text x="38" y="54" >Число задач</text>
<text x="316" y="96" text-anchor="end">Длинный текст</text>
<rect x="330.000" y="79" width="620.000" height="24" fill="#3477aa"/>
<text x="640.0" y="96" text-anchor="middle" fill="white">24</text>
<text x="958.0" y="96" >24</text>
<text x="316" y="135" text-anchor="end">Эталон вычисляется в день прогона</text>
<rect x="330.000" y="118" width="361.667" height="24" fill="#3477aa"/>
<text x="510.833" y="135" text-anchor="middle" fill="white">14</text>
<text x="699.667" y="135" >14</text>
<text x="316" y="174" text-anchor="end">Короткий текст</text>
<rect x="330.000" y="157" width="258.333" height="24" fill="#3477aa"/>
<text x="459.167" y="174" text-anchor="middle" fill="white">10</text>
<text x="596.333" y="174" >10</text>
<text x="316" y="213" text-anchor="end">Число</text>
<rect x="330.000" y="196" width="129.167" height="24" fill="#3477aa"/>
<text x="394.583" y="213" text-anchor="middle" fill="white">5</text>
<text x="467.167" y="213" >5</text>
<text x="316" y="252" text-anchor="end">Проверка состояния файла</text>
<rect x="330.000" y="235" width="77.500" height="24" fill="#3477aa"/>
<text x="368.75" y="252" text-anchor="middle" fill="white">3</text>
<text x="415.5" y="252" >3</text>
<text x="316" y="291" text-anchor="end">Короткий список</text>
<rect x="330.000" y="274" width="51.667" height="24" fill="#3477aa"/>
<text x="355.833" y="291" text-anchor="middle" fill="white">2</text>
<text x="389.667" y="291" >2</text>
</g>
</svg>
