<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="290" viewBox="0 0 1050 290" role="img" aria-labelledby="title">
<title id="title">Источники данных и инструментов: настройка и подключение</title>
<rect width="100%" height="100%" fill="white"/>
<g font-family="Arial, sans-serif" font-size="14" fill="#243447">
<text x="20" y="26" font-size="19" font-weight="bold">Источники данных и инструментов: настройка и подключение</text>
<rect x="20" y="43" width="12" height="12" fill="#3477aa"/>
<text x="38" y="54" >Число источников</text>
<text x="316" y="96" text-anchor="end">Указаны в настройках ассистента</text>
<rect x="330.000" y="79" width="620.000" height="24" fill="#3477aa"/>
<text x="640.0" y="96" text-anchor="middle" fill="white">63</text>
<text x="958.0" y="96" >63</text>
<text x="316" y="135" text-anchor="end">Успешно подключены при проверке</text>
<rect x="330.000" y="118" width="314.921" height="24" fill="#3477aa"/>
<text x="487.46" y="135" text-anchor="middle" fill="white">32</text>
<text x="652.921" y="135" >32</text>
<text x="316" y="174" text-anchor="end">Нужны для задач девяти историй</text>
<rect x="330.000" y="157" width="108.254" height="24" fill="#3477aa"/>
<text x="384.127" y="174" text-anchor="middle" fill="white">11</text>
<text x="446.254" y="174" >11</text>
<text x="316" y="213" text-anchor="end">Успешно подключены из необходимых историям</text>
<rect x="330.000" y="196" width="98.413" height="24" fill="#3477aa"/>
<text x="379.206" y="213" text-anchor="middle" fill="white">10</text>
<text x="436.413" y="213" >10</text>
<text x="20" y="249" font-size="12" fill="#57606a">Успешное подключение не гарантирует выполнение запросов</text>
</g>
</svg>
