<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="212" viewBox="0 0 1050 212" role="img" aria-labelledby="title">
<title id="title">Наличие оценок и результаты предварительного прогона</title>
<rect width="100%" height="100%" fill="white"/>
<g font-family="Arial, sans-serif" font-size="14" fill="#243447">
<text x="20" y="26" font-size="19" font-weight="bold">Наличие оценок и результаты предварительного прогона</text>
<rect x="20" y="43" width="12" height="12" fill="#3477aa"/>
<text x="38" y="54" >Правильный ответ</text>
<rect x="188" y="43" width="12" height="12" fill="#d49632"/>
<text x="206" y="54" >Неверный ответ</text>
<rect x="340" y="43" width="12" height="12" fill="#8b579f"/>
<text x="358" y="54" >Нет оценки: не удалось вычислить эталон</text>
<text x="316" y="96" text-anchor="end">Пробная часть прогона</text>
<rect x="330.000" y="79" width="145.882" height="24" fill="#3477aa"/>
<text x="402.941" y="96" text-anchor="middle" fill="white">4</text>
<rect x="475.882" y="79" width="36.471" height="24" fill="#d49632"/>
<text x="494.118" y="96" text-anchor="middle" fill="white">1</text>
<text x="520.353" y="96" >5</text>
<text x="316" y="135" text-anchor="end">Задачи, чувствительные ко времени</text>
<rect x="330.000" y="118" width="328.235" height="24" fill="#3477aa"/>
<text x="494.118" y="135" text-anchor="middle" fill="white">9</text>
<rect x="658.235" y="118" width="291.765" height="24" fill="#8b579f"/>
<text x="804.118" y="135" text-anchor="middle" fill="white">8</text>
<text x="958.0" y="135" >17</text>
<text x="20" y="171" font-size="12" fill="#57606a">Число задач</text>
</g>
</svg>
