[project]
name = "mlsd-project"
version = "0.1.0"
description = "ML System Design course project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[dependency-groups]
dev = ["pre-commit>=4.0", "ruff>=0.17", "pyrefly>=1.0", "types-pyyaml"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs/agents", ".agents"]
force-exclude = true

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "N",   # pep8-naming
    "RUF", # ruff-specific
]
# Russian text uses Cyrillic letters that look like Latin ones.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.format]
quote-style = "double"

[tool.pyrefly]
project-includes = ["scripts"]
